name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ansible:
    name: Ansible (lint, syntax, renders, comparator)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tools
        run: |
          python -m pip install --upgrade pip
          pip install "ansible-lint==26.4.0" yamllint pyyaml
          ansible-galaxy collection install -r ansible/requirements.yml
      - name: yamllint
        run: yamllint .
      - name: ansible-lint
        working-directory: ansible
        run: ansible-lint
      - name: syntax-check every playbook
        working-directory: ansible
        run: |
          ansible-playbook site.yml --syntax-check
          for pb in playbooks/*.yml; do ansible-playbook "$pb" --syntax-check; done
      - name: forbid check_mode false
        run: ./scripts/lint-no-check-mode-false.sh
      - name: controller-only tasks (Proxmox API delegated to localhost, get_url checksummed)
        run: python3 scripts/lint-controller-tasks.py
      - name: Tailscale ACL validator regression tests
        run: python3 scripts/tests/test-validate-acl.py
      - name: render firewall / ACL and diff against baselines
        run: ./scripts/check-renders.sh
      - name: guest-config comparator tests
        run: ./scripts/tests/test-check-guest-config.sh
      - name: firewall coverage vs live listeners
        run: python3 scripts/tests/check-fw-coverage.py
      - name: coverage check can fail (control, vault :9100 rule deleted)
        run: |
          set -u
          ctl=$(mktemp -d)
          cp ansible/roles/proxmox_firewall/files/expected/*.fw "$ctl/"
          sed -i '/-dport 9100/d' "$ctl/101.fw"
          if python3 scripts/tests/check-fw-coverage.py --fw-dir "$ctl"; then
            echo "::error::coverage check passed with vault :9100 rule deleted"; exit 1
          fi
          echo "control OK: deleting one rule makes the coverage check fail"
      - name: fw-rollback dry run
        run: |
          bash scripts/fw-rollback.sh --dry-run now
          bash scripts/fw-rollback.sh --dry-run arm 10
          bash scripts/fw-rollback.sh --dry-run disarm
      - name: fw-rollback tests (sysctl reset, conntrack watch)
        run: bash scripts/tests/test-fw-rollback.sh
      - name: fw-rollback tests can fail (control, no sysctl reset)
        run: |
          set -eu
          old=$(mktemp)
          sed '/bridge-nf-call-iptables=0/d' scripts/fw-rollback.sh > "$old"
          if grep -q 'bridge-nf-call-iptables=0' "$old"; then
            echo "::error::control mutation did not apply"; exit 1
          fi
          if bash scripts/tests/test-fw-rollback.sh "$old"; then
            echo "::error::tests passed against a rollback that leaves bridge-nf-call on"; exit 1
          fi
          echo "control OK: a rollback without the sysctl reset fails the tests"

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - run: shellcheck --version
      - run: >-
          shellcheck -x scripts/*.sh scripts/tests/*.sh scripts/clone-vm/*.sh kubernetes/bin/*.sh
          opentofu/scripts/*.sh opentofu/scripts/fleet opentofu/scripts/lib/*.sh opentofu/scripts/smoke/*.sh

  opentofu:
    name: OpenTofu (fmt, validate, smoke + controls)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: opentofu
    steps:
      - uses: actions/checkout@v4
      - uses: opentofu/setup-opentofu@v1
        with:
          tofu_version: 1.13.2
          tofu_wrapper: false
      - name: Install age
        run: sudo apt-get update && sudo apt-get install -y age
      - run: tofu fmt -check -recursive
      - name: Proxmox API TLS stays verified (pve_insecure false, CA pinned)
        run: bash scripts/lint-pve-tls.sh
      - name: tofu validate
        run: |
          tofu init -backend=false -input=false
          tofu validate
      - name: smoke test against the fake Proxmox API
        run: bash scripts/smoke/fleet-smoke.sh
      - name: controls (every smoke check must be able to fail)
        run: bash scripts/smoke/fleet-smoke-controls.sh

  kubernetes:
    name: Kubernetes (kubeconform, Argo tree)
    runs-on: ubuntu-24.04
    env:
      KUBECONFORM_VERSION: v0.7.0
    steps:
      - uses: actions/checkout@v4
      - name: Install kubeconform
        run: |
          curl -sSL -o /tmp/kc.tgz "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          tar -xzf /tmp/kc.tgz -C /tmp kubeconform
          sudo install /tmp/kubeconform /usr/local/bin/kubeconform
      # CRD catalog pinned to a commit: its Cilium 1.20.2 schema update (catalog #1010)
      # can't be loaded by kubeconform v0.7.0 ("could not find schema"). Bump on purpose.
      - name: kubeconform (core + CRD schemas)
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/ea03cc2abb64ddc0a927c1e3d48a3d0abf66a3de/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            -skip InitConfiguration,ClusterConfiguration \
            -ignore-filename-pattern 'values\.yaml$' \
            kubernetes/
      - name: Argo CD app-of-apps structure
        run: |
          pip install pyyaml
          python3 scripts/tests/check-argo-apps.py
      - name: steel-browser egress stays public-only
        run: python3 scripts/tests/check-steel-egress.py
