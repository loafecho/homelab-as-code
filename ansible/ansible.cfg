[defaults]
inventory = inventory/hosts.yml
roles_path = roles
host_key_checking = True
retry_files_enabled = False
callback_result_format = yaml
interpreter_python = auto_silent
nocows = True
# Guests are reached as root by default; per-host overrides live in the
# inventory. The control node runs Ansible against itself locally.
remote_user = root

[inventory]
enable_plugins = yaml

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
