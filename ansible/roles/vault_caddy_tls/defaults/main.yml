---
# roles/vault_caddy_tls — thin Caddy TLS front for the vault guest.
#
# WHY: group_vars/all.yml `vault_endpoint.port: 443` and host_vars/vault.yml's
# secret_consumers ingress rule both target vault:443, but nothing has ever
# listened there — Infisical is bare HTTP with docker mapping 0.0.0.0:80->8080.
# On a firewall flip (policy_in DROP with no :80 rule) every secret_consumer
# would silently fail. This role makes :443 a REAL listener (Caddy) that
# reverse-proxies to local Infisical :80, closing that gap.
#
# STAGED BY DEFAULT: vault_caddy_tls_deploy: false means this role only
# renders the Caddyfile + tbot config to build/caddy/ for review. See README.md
# for the explicit, deliberate steps to flip it live.

# --- Safety switch (mirrors roles/proxmox_firewall's firewall_apply) --------
vault_caddy_tls_deploy: false

# --- Listener (must track group_vars/all.yml vault_endpoint.port) ----------
vault_caddy_tls_listen_port: 443

# --- Upstream: today's bare-HTTP Infisical reality on the vault VM ---------
vault_caddy_upstream_host: 127.0.0.1
vault_caddy_upstream_port: 80

# --- TLS material paths ON THE VAULT VM once deployed -----------------------
# Populated + kept fresh by tbot; Caddy only ever reads them.
vault_caddy_tls_dir: /etc/caddy/tls
vault_caddy_tls_cert_path: "{{ vault_caddy_tls_dir }}/tlscert.pem"
vault_caddy_tls_key_path: "{{ vault_caddy_tls_dir }}/key.pem"
vault_caddy_tls_ca_path: "{{ vault_caddy_tls_dir }}/ca.pem"

# --- Staging output for review (gitignored; same pattern as
#     roles/proxmox_firewall's firewall_build_dir) --------------------------
vault_caddy_build_dir: "{{ inventory_dir }}/../build/caddy"

# --- Teleport cert issuance (OSS-safe path) ---------------------------------
# Teleport (OSS) runs in its own LXC. We reuse Teleport's built-in Database ("db")
# CA purely as a convenient internal CA to mint a LAN TLS leaf cert for Caddy.
# vault is NOT a real Teleport-protected database and Teleport is NOT in the
# live secret-fetch data path — cert issuance/renewal ONLY, no new SPOF:
# if teleport/tbot is down, Caddy keeps serving its last-renewed cert until
# expiry, Infisical fetches are unaffected either way.
#
# Deliberately NOT using Teleport Enterprise Workload Identity / SPIFFE SVIDs
# (license-gated) — this is the plain OSS `tctl auth sign` + `tbot database`
# output pattern.
teleport_proxy_addr: "{{ guests.teleport.ip }}:3025"   # auth/proxy address
teleport_ca_name: db
teleport_cert_common_name: vault.lan
teleport_cert_dns_sans:
  - vault.lan
  - "{{ guests.vault.ip }}"
teleport_cert_ttl: 2190h                               # ~3 months; tbot renews well before expiry
teleport_bot_name: vault-caddy-tls
# Name of the (non-functional) Teleport "database" resource registered solely
# so tbot's `database` output has a target to sign against. Created out of
# band with `tctl` during the live rollout (see README.md) — not in this repo.
teleport_db_resource_name: vault-tls-front

# tbot release integrity. The control node caches the release tarball in an
# operator-owned 0700 directory (never the shared /tmp, where another local
# user could pre-plant a file that get_url would accept as-is), and get_url
# verifies it against this digest on every run, replacing or rejecting a file
# that does not match. No digest is committed: Teleport publishes no .sha256
# for the tarball URL pinned in tasks/deploy.yml, so the rollout refuses to
# run until you set the verified SHA-256 of that exact file
# (-e vault_caddy_tls_tbot_sha256=<64 hex chars>).
vault_caddy_tls_tbot_sha256: ""
vault_caddy_tls_tbot_cache_dir: "{{ lookup('ansible.builtin.env', 'HOME') }}/.cache/vault_caddy_tls"
