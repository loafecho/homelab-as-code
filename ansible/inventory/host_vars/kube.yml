---
# kube (VM 130) - the single-node Kubernetes cluster (kubeadm + Cilium).
#
# Its own trust zone: the node carries workloads of different sensitivity at
# once, so folding it into any existing zone would over-grant in one direction.
# The fine-grained segmentation is INSIDE the node (Cilium NetworkPolicy,
# default-deny per namespace, plus per-namespace RBAC and per-namespace
# secret-store identities; see kubernetes/). This tap is the coarse outer ring.
#
# Closes a common exposure: without policy_in DROP, :6443 answers to every
# host on the LAN, plus Hubble :4244 and Cilium metrics :9963/:9964 (host
# network ports that no Service publishes).
zone: cluster
firewall:
  policy_in: DROP
  policy_out: ACCEPT       # image pulls, tailnet, upstream APIs; all app-initiated
  always_allow_established: true
  ingress:
    - { src: ref:admin_devices, port: 22, proto: tcp, enabled: true, comment: "T1 break-glass SSH" }
    - { src: control, port: 22, proto: tcp, enabled: true, comment: "Ansible control" }
    - { src: control, port: 6443, proto: tcp, enabled: true,
        comment: "kubectl/helm/Argo CLI from the control node, the ONLY allowed path to the API server" }
    # Deliberately NOT opened to the LAN: Hubble :4244 and Cilium metrics
    # :9963/:9964. They are host-network ports with no Service in front.
    # Single-node cluster: kubelet, etcd and Cilium talk to themselves on the
    # node (never through the tap), so each listener from live `ss -tulnp`
    # (2026-11-01) is opened to the management set only.
    - { src: mgmt, port: 10250, proto: tcp, enabled: true, comment: "kubelet - no LAN client, management only" }
    - { src: mgmt, port: 2379, proto: tcp, enabled: true, comment: "etcd client - no LAN client, management only" }
    - { src: mgmt, port: 2380, proto: tcp, enabled: true, comment: "etcd peer - no LAN client, management only" }
    - { src: mgmt, port: 4240, proto: tcp, enabled: true, comment: "cilium health - no LAN client, management only" }
    - { src: mgmt, port: 4244, proto: tcp, enabled: true, comment: "hubble - no LAN client, management only" }
    - { src: mgmt, port: 9963, proto: tcp, enabled: true, comment: "cilium-operator metrics - no LAN client, management only" }
    - { src: mgmt, port: 9964, proto: tcp, enabled: true, comment: "cilium-envoy metrics - no LAN client, management only" }
    - { src: mgmt, port: 8472, proto: udp, enabled: true, comment: "cilium VXLAN - single node, no LAN peer, management only" }
    - { src: mgmt, port: 30204, proto: tcp, enabled: true,
        comment: "portainer-agent NodePort - its LoadBalancer is tailnet-only, management only" }
    - { src: internet, port: 41641, proto: udp, enabled: true,
        comment: "tailscaled (operator proxy pods) - they bind random ports in pod netns; DERP rides established" }
  egress: []

# --- Declared hardware ---
guest_cores: 8
guest_memory: 24576
guest_balloon: 0
guest_disk_gb: 32
guest_scsi1_gb: 250
guest_net0: "virtio,bridge=vmbr0"
guest_onboot: true
