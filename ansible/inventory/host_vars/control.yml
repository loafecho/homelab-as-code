---
# control (VM 100) - control plane / Ansible orchestrator.
zone: control
firewall:
  policy_in: DROP
  policy_out: ACCEPT                   # control -> all guests:22 (Ansible) is egress, covered by ACCEPT
  always_allow_established: true
  ingress:
    - { src: ref:admin_devices, port: 22, proto: tcp, enabled: true, comment: "T1 break-glass SSH" }
    # Rules below come from live `ss -tulnp` (2026-11-01, captured in
    # roles/proxmox_firewall/files/listeners/<vmid>.txt). A port with no known
    # client is opened to the management set (`src: mgmt`) only.
    - { src: kube, port: 8787, proto: tcp, enabled: true,
        comment: "webhook receiver - the workflow engine on kube POSTs to control:8787" }
    - { src: mgmt, port: 12865, proto: tcp, enabled: true, comment: "netserver (netperf) - no known client, management only" }
    - { src: mgmt, port: 2112, proto: udp, enabled: true, comment: "irtt server - no known client, management only" }
    - { src: internet, port: 41641, proto: udp, enabled: true,
        comment: "tailscaled direct WireGuard (peers authenticate with node keys; DERP fallback rides established)" }
  egress: []
  # control is the SOURCE of the "control -> all guests:22" Ansible rule. With
  # policy_out: ACCEPT that egress needs no explicit entry here; the matching
  # ingress (control -> :22) is declared on every guest.

# --- Declared hardware (compared against live `qm config` by scripts/check-guest-config.sh) ---
guest_cores: 8
guest_memory: 16384
guest_balloon: 0
guest_disk_gb: 64
guest_net0: "virtio,bridge=vmbr0"
guest_onboot: true
guest_startup: "order=1"
