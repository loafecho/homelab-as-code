---
# ============================================================================
# group_vars/all.yml: single source of truth for the network data model.
#
# Every firewall rule, render and comparator resolves names through the maps
# below. Change a value here, re-render, review the diff against the
# committed baselines, then apply. Addresses are RFC 5737 examples.
# ============================================================================

lan_cidr: "192.0.2.0/24"
lan_gateway: "192.0.2.1"              # router: DHCP, DNS, NTP
dns_server: "192.0.2.1"
dhcp_pool: "192.0.2.150-192.0.2.199"

# Proxmox host (NOT a guest; its :8006 lives in cluster.fw, not a <vmid>.fw).
proxmox_host:
  name: hypervisor
  ip: "192.0.2.10"
  mgmt_port: 8006                     # web UI + noVNC out-of-band console

# Break-glass SSH (T1) and noVNC console (T2) sources: ONLY these addresses,
# each with a DHCP reservation on the router.
admin_devices:
  - { name: admin-laptop, ip: "192.0.2.50" }
  - { name: admin-workstation, ip: "192.0.2.51" }

# OpenTofu deploy box: a Raspberry Pi that holds the hardware key and runs
# `tofu apply` against the Proxmox API on the hypervisor's :8006, so it joins
# the datacenter `management` IPSET. It gets NO guest SSH or break-glass
# reach; that stays admin_devices only. (The same Pi used to be the uptime
# monitor; it was reflashed for this job and the monitor role is retired.)
deploy_box: { name: deploy-box, ip: "192.0.2.190" }

# Hosts that are not modeled guests but are known clients of guest ports.
# telemetry (CT 103) scrapes vault's node_exporter on :9100.
monitoring_sources:
  - { name: telemetry, vmid: 103, ip: "192.0.2.129" }

# LAN resolvers a DROP-egress guest (vault) must still reach: tailscaled
# resolves its control and relay hosts before MagicDNS is up, and chrony
# resolves pool.ntp.org.
dns_servers:
  - { name: adguard, ip: "192.0.2.53" }
  - { name: router, ip: "192.0.2.1" }

# Canonical guest map: vmid + zone + reserved IP + egress policy.
guests:
  control: { vmid: 100, ip: "192.0.2.100", zone: control, egress_policy: accept }
  vault: { vmid: 101, ip: "192.0.2.101", zone: secrets, egress_policy: drop }
  media: { vmid: 112, ip: "192.0.2.112", zone: home, egress_policy: accept }
  teleport: { vmid: 115, ip: "192.0.2.115", zone: access, egress_policy: accept }
  kube: { vmid: 130, ip: "192.0.2.130", zone: cluster, egress_policy: accept }
  # engine: a worker container OpenTofu creates (opentofu/main.tf, CT 180).
  engine: { vmid: 180, ip: "192.0.2.61", zone: worker, egress_policy: accept }
  email: { vmid: 901, ip: "192.0.2.174", zone: sensitive, egress_policy: accept }
  # gateway: DMZ reverse proxy, NOT BUILT. Assign IP + reservation when provisioned.
  gateway: { vmid: ~, ip: ~, zone: dmz, egress_policy: accept }

# Trust zones. Default-deny east-west AND intra-zone; explicit allow-only.
zones:
  control: "control: orchestrator, SSH to every guest (Ansible)"
  secrets: "vault: Infisical secrets sink; egress DROP; never reached from the DMZ"
  access: "teleport: audited access plane for outside integrations"
  sensitive: "email: the mail server; business, legal and financial data"
  home: "media: household services"
  dmz: "gateway: public traffic terminates here (not built yet)"
  cluster: "kube: Kubernetes node; internal segmentation is Cilium NetworkPolicy per namespace"
  # Job runners, not data holders: no secrets-zone reach (not in
  # secret_consumers), and only the control node calls in.
  worker: "engine: worker containers for jobs (a SearXNG search service first)"

# Hosts allowed to fetch secrets from vault (all resolve to the vault:443 target).
# The home zone is a deliberate, documented carve-out: media fetches its own
# app credentials. The DMZ must never appear here.
secret_consumers: [control, email, teleport, media]

vault_endpoint:
  ip: "192.0.2.101"
  port: 443
  # Consumers reach Infisical ONLY over the tailnet: `tailscale serve` on
  # vault's tailnet address :443 -> 127.0.0.1:80 (roles/vault_infisical
  # publishes it on loopback). Nothing listens on vault's LAN :443 or :80.

# Live vmids deliberately NOT managed by this repo. scripts/check-guest-config.sh
# fails on any live vmid absent from BOTH the inventory and this allowlist, so
# removing an entry without inventorying the guest turns the gate red, by design.
unmanaged_vmids:
  - 120   # scratch VM on an internal-only bridge, no LAN address
