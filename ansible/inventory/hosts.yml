---
# Example inventory for a single-node Proxmox homelab, grouped by TRUST ZONE
# (one `zone_<name>` group per zone).
#
# Every address here is an RFC 5737 documentation address and every name is a
# generic role. Replace them with your own before running anything live.
#
# Source of truth for guest -> vmid -> IP is group_vars/all.yml (the `guests`
# map); per-guest firewall data and declared hardware live in
# host_vars/<guest>.yml. This file only declares zone membership and how
# Ansible connects to each guest.
#
# Connection notes:
#   - VMs are reached over SSH at their LAN address.
#   - LXC containers are reached through the Proxmox host with
#     community.proxmox.proxmox_pct_remote (SSH to the hypervisor, then
#     `pct exec` into the container by vmid), so a container does not need
#     its own sshd.
#   - `kube` refuses root and takes an unprivileged user with become.
all:
  vars:
    ansible_user: root

  children:
    # --- the Proxmox HOST itself (not a guest, no guest_vmid) ---
    # Target of playbooks/apply-firewall.yml only: /etc/pve/firewall lives on
    # the hypervisor.
    hypervisors:
      hosts:
        hypervisor:
          ansible_host: 192.0.2.10

    # --- the Ansible control node, as a local target ---
    # Present so the localhost-targeted plays (firewall render, Tailscale ACL
    # validation) inherit group_vars/all (the `guests` map etc.). Not a zone.
    local:
      hosts:
        localhost:
          ansible_connection: local

    # --- mgmt / control plane ---
    zone_control:
      hosts:
        control:
          ansible_host: 192.0.2.100
          guest_vmid: 100
          guest_type: vm
          # The control node runs the playbooks against itself locally.
          ansible_connection: local

    # --- secrets sink (self-hosted Infisical) ---
    zone_secrets:
      hosts:
        vault:
          ansible_host: 192.0.2.101
          guest_vmid: 101
          guest_type: vm

    # --- business / legal / financial data ---
    zone_sensitive:
      hosts:
        email:
          # sshd is off in this container (Teleport is its only door), so
          # Ansible reaches it with `pct exec` through the Proxmox host.
          ansible_connection: community.proxmox.proxmox_pct_remote
          ansible_host: hypervisor     # the PROXMOX HOST, not the CT: pct_remote's remote_addr
          proxmox_vmid: 901
          guest_vmid: 901
          guest_type: lxc

    # --- audited access plane (Teleport) ---
    zone_access:
      hosts:
        teleport:
          ansible_connection: community.proxmox.proxmox_pct_remote
          ansible_host: hypervisor     # the PROXMOX HOST, not the CT: pct_remote's remote_addr
          proxmox_vmid: 115
          guest_vmid: 115
          guest_type: lxc

    # --- home services (media, file shares) ---
    zone_home:
      hosts:
        media:
          ansible_host: 192.0.2.112
          guest_vmid: 112
          guest_type: vm

    # --- kubernetes cluster node ---
    # Its own zone: the node carries workloads from several sensitivity levels
    # at once, so the real segmentation is Cilium NetworkPolicy per namespace
    # inside the node. The host firewall here is only the coarse outer ring.
    zone_cluster:
      hosts:
        kube:
          ansible_host: 192.0.2.130
          ansible_user: admin
          ansible_become: true
          guest_vmid: 130
          guest_type: vm

    # --- worker containers for jobs ---
    # engine runs SearXNG; its only caller is an agent gateway on the control
    # node. OpenTofu creates it (opentofu/main.tf, CT 180); it is in no
    # site.yml play. Unlike the pct_remote containers it keeps sshd on and
    # takes Ansible directly over the LAN with its own key, the one OpenTofu
    # baked into the container (this guest only).
    zone_worker:
      hosts:
        engine:
          ansible_host: 192.0.2.61
          ansible_user: root
          ansible_ssh_private_key_file: ~/.ssh/id_engine_ansible
          ansible_ssh_common_args: -o IdentitiesOnly=yes
          guest_vmid: 180
          guest_type: lxc

    # --- DMZ (public front door) ---
    zone_dmz:
      hosts:
        # gateway: the single reverse-proxy DMZ guest. NOT BUILT YET:
        # no vmid, no reserved IP. All gateway firewall rules ship enabled:false.
        gateway:
          ansible_host: ~
          guest_vmid: ~
          guest_type: vm

    # The monitor Pi is retired: it was reflashed as the OpenTofu deploy box,
    # which is not Ansible-managed. group_vars `deploy_box` carries its address
    # for the datacenter management IPSET.
