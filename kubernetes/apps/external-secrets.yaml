apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://charts.external-secrets.io
    targetRevision: 2.7.0 # pinned; bump deliberately
    chart: external-secrets
    helm:
      values: |
        installCRDs: true
  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - ServerSideApply=true  # store CRDs exceed the 262KB client-side-apply annotation limit
