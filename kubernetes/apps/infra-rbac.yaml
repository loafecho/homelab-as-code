apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-rbac
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://github.com/loafecho/homelab-as-code.git
    targetRevision: main
    path: kubernetes/infra/rbac
  destination:
    server: https://kubernetes.default.svc
    namespace: argocd
  # No syncPolicy, on purpose: manual sync. This app owns the `cluster` AppProject, so a push to main
  # must not widen Argo's own permissions unreviewed. Apply a reviewed change with
  # `argocd app sync infra-rbac`. (Don't write `syncPolicy: {}`: the API server drops the empty block,
  # so root shows OutOfSync forever.)
