apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: tailscale-operator
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://pkgs.tailscale.com/helmcharts
    targetRevision: 1.98.4 # pinned; bump deliberately
    chart: tailscale-operator
    helm:
      values: |
        operatorConfig: {}
  destination:
    server: https://kubernetes.default.svc
    namespace: tailscale
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
