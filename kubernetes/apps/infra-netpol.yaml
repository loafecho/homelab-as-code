apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: infra-netpol
  namespace: argocd
spec:
  project: cluster
  source:
    repoURL: https://github.com/loafecho/homelab-as-code.git
    targetRevision: main
    path: kubernetes/infra/netpol
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
