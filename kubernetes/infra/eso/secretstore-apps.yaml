# One SecretStore per namespace, each with its own Infisical machine identity
# (universal auth). The bootstrap Secret holding that identity's client id and
# secret is created out of band; see infra/eso/bootstrap-secret.example.yaml.
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: infisical-apps
  namespace: apps
spec:
  provider:
    infisical:
      # TLS through the vault-egress Tailscale proxy (vault-egress.yaml). Replace
      # with the tailnet name of your secrets host.
      hostAPI: https://vault.example.com
      auth:
        universalAuthCredentials:
          clientId:
            name: infisical-apps-bootstrap
            key: clientId
          clientSecret:
            name: infisical-apps-bootstrap
            key: clientSecret
      secretsScope:
        projectSlug: example-k8s-apps
        environmentSlug: prod
        secretsPath: /
