# Tailscale egress proxy: gives the ESO controller an in-cluster path to the
# secrets host's existing `tailscale serve` TLS endpoint (a real Let's Encrypt
# certificate), so SecretStore hostAPI can be https without changing the host.
# The operator rewrites spec.externalName at runtime to point at its proxy
# Service in ns tailscale; the infra-eso Application carries ignoreDifferences
# for that field (with RespectIgnoreDifferences) so selfHeal doesn't fight it.
#
# Companion config (kubeadm CoreDNS addon, not Argo-managed): a CoreDNS rewrite
# so the secrets host's tailnet name resolves in-cluster to this Service:
#   rewrite stop {
#     name exact vault.example.com vault-egress.external-secrets.svc.cluster.local
#     answer auto
#   }
# ACL side: exactly one grant, tag:k8s-eso-egress -> the secrets host on :443.
# This proxy carries its OWN tag (annotation below) because every other operator
# proxy (the ingress proxies and the portainer-agent LB) keeps the default
# tag:k8s; a grant keyed on tag:k8s would reach the secrets host from all of
# them. The policy needs tagOwners "tag:k8s-eso-egress": ["tag:k8s-operator"].
apiVersion: v1
kind: Service
metadata:
  name: vault-egress
  namespace: external-secrets
  annotations:
    tailscale.com/tailnet-fqdn: vault.example.com
    tailscale.com/tags: tag:k8s-eso-egress
spec:
  type: ExternalName
  externalName: placeholder
  ports:
    - name: https
      port: 443
      protocol: TCP
