apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Ingress, Egress]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vault-egress
  namespace: external-secrets
spec:
  podSelector: {}
  policyTypes: [Egress]
  egress:
    - to:
        - ipBlock:
            cidr: 192.0.2.101/32 # the secrets host's LAN address, /32. Rollback path only: the primary path is the tailnet egress proxy below.
      ports:
        - protocol: TCP
          port: 80
        - protocol: TCP
          port: 443
    # Primary path: ESO reaches Infisical over TLS via the vault-egress
    # Tailscale proxy (ns tailscale) instead of the LAN address.
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: tailscale
      ports:
        - protocol: TCP
          port: 443
---
# Cilium: ipBlock/CIDR rules never match node/host identities, so API-server
# access needs entity selectors (CiliumNetworkPolicy), not a plain netpol.
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: allow-kube-apiserver
  namespace: external-secrets
spec:
  endpointSelector: {}
  egress:
    - toEntities: ["kube-apiserver", "host"]
  ingress:
    - fromEntities: ["kube-apiserver", "host"]
