apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-ingress
  namespace: tailscale
spec:
  podSelector: {}
  policyTypes: [Ingress]
# Egress is intentionally left open: the Tailscale operator needs DERP relay
# and control-plane traffic out to the tailnet.
---
# The ESO controller dials the vault-egress proxy pod
# (this ns) on 443 to reach Infisical over the tailnet. Ingress proxies are
# unaffected — tailnet traffic arrives via tunnel, not pod-network ingress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-eso-to-egress
  namespace: tailscale
spec:
  podSelector: {}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: external-secrets
      ports:
        - protocol: TCP
          port: 443
