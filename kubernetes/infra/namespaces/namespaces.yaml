# Namespaces are zone-aligned: every workload namespace starts default-deny
# (infra/netpol) and gets its own secret-store identity (infra/eso).
apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    zone: apps
---
apiVersion: v1
kind: Namespace
metadata:
  name: notify
  labels:
    zone: notify
---
apiVersion: v1
kind: Namespace
metadata:
  name: external-secrets
---
apiVersion: v1
kind: Namespace
metadata:
  name: tailscale
---
# Node telemetry: an Alloy DaemonSet pushing metrics to Prometheus outside the cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: telemetry
  labels:
    zone: telemetry
---
# Portainer agent, so a Portainer server elsewhere can manage this cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: portainer
  labels:
    zone: portainer
