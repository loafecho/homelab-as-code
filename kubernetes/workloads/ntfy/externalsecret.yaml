apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ntfy
  namespace: notify
spec:
  secretStoreRef:
    name: infisical-notify
    kind: SecretStore
  refreshInterval: 1h
  target:
    name: ntfy
  data:
    - secretKey: NTFY_AUTH_USERS
      remoteRef:
        key: NTFY_AUTH_USERS
    - secretKey: NTFY_AUTH_TOKENS
      remoteRef:
        key: NTFY_AUTH_TOKENS
