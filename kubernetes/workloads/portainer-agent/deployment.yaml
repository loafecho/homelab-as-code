# Pinned to the Portainer server's version (2.33.5). Bump both together.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: portainer-agent
  namespace: portainer
spec:
  replicas: 1
  selector:
    matchLabels: {app: portainer-agent}
  template:
    metadata:
      labels: {app: portainer-agent}
    spec:
      serviceAccountName: portainer-sa-clusteradmin
      containers:
        - name: portainer-agent
          image: portainer/agent:2.33.5
          imagePullPolicy: IfNotPresent
          env:
            - {name: LOG_LEVEL, value: INFO}
            - {name: AGENT_CLUSTER_ADDR, value: portainer-agent-headless}
            # Shared secret with the Portainer server (same AGENT_SECRET in the
            # server's env). Without it the agent trusts whichever server key it
            # sees first, while holding cluster-admin. The Secret is created out
            # of band, never in git. Not optional: a missing Secret holds the
            # new pod in CreateContainerConfigError and the old pod keeps serving.
            - name: AGENT_SECRET
              valueFrom:
                secretKeyRef: {name: portainer-agent-secret, key: AGENT_SECRET}
            - name: KUBERNETES_POD_IP
              valueFrom:
                fieldRef: {fieldPath: status.podIP}
          ports:
            - {containerPort: 9001, protocol: TCP}
          resources:
            requests: {cpu: 10m, memory: 32Mi}
            limits: {memory: 128Mi}
