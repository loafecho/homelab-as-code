# Ingress: only this Service's own tailscale LB proxy pod, on 9001 (not every proxy in ns tailscale).
# Egress: DNS + the kube API, nothing else (no LAN, no tailnet, no internet).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-ingress
  namespace: portainer
spec:
  podSelector:
    matchLabels: {app: portainer-agent}
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector:
            matchLabels: {kubernetes.io/metadata.name: tailscale}
          podSelector:
            matchLabels:
              tailscale.com/parent-resource: portainer-agent
              tailscale.com/parent-resource-ns: portainer
              tailscale.com/parent-resource-type: svc
      ports:
        - {protocol: TCP, port: 9001}
---
apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: agent-egress
  namespace: portainer
spec:
  endpointSelector:
    matchLabels: {app: portainer-agent}
  egress:
    - toEndpoints:
        - matchLabels:
            k8s-app: kube-dns
            io.kubernetes.pod.namespace: kube-system
      toPorts:
        - ports:
            - {port: "53", protocol: UDP}
            - {port: "53", protocol: TCP}
    - toEntities: [kube-apiserver]
