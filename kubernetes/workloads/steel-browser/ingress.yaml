# Tailnet-only (tailscale ingress, no Funnel). Which devices may reach it is decided by the tailnet ACL.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steel
  namespace: apps
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: steel-browser-api
      port: {number: 3000}
  tls:
    - hosts: [steel]
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: steel-ui
  namespace: apps
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: steel-browser-ui
      port: {number: 80}
  tls:
    - hosts: [steel-ui]
