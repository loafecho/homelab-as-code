apiVersion: v1
kind: Service
metadata:
  name: steel-browser-api
  namespace: apps
spec:
  selector: {app: steel-browser-api}
  ports:
    - {name: http, port: 3000, targetPort: 3080}   # via the host-shim sidecar
---
apiVersion: v1
kind: Service
metadata:
  name: steel-browser-ui
  namespace: apps
spec:
  selector: {app: steel-browser-ui}
  ports:
    - {name: http, port: 80, targetPort: 80}
